<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Projekt{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                Planer e-sportowy
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link text-light" href="{% url 'event_list' %}">
                    Wydarzenia
                </a>

                {% if user.is_staff %}
                    <a class="nav-link text-light" href="{% url 'game_create' %}">
                        Dodaj grę
                    </a>
                    <a class="nav-link text-light" href="{% url 'organizer_create' %}">
                        Dodaj organizatora
                    </a>
                {% endif %}

                <a class="nav-link text-light" href="/admin/">
                    Panel admina
                </a>
            </div>
        </div>
    </nav>


    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
