{% extends 'core/base.html' %}

{% block title %}Dodaj organizatora | Planer e-sportowy{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-body p-4">
            <h1 class="h3 mb-4">Dodaj organizatora</h1>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Zapisz organizatora
                </button>

                <a href="{% url 'home' %}"
                   class="btn btn-outline-secondary">
                    Powrót
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
